<meta charset="utf-8">
<title>Memorii tehnice</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Narrow:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: masă de lucru – listă de proiecte în stânga, fișa proiectului cu tab-uri în dreapta */
:root{
  --bg:#F3F4F6; --surface:#FFFFFF; --sunk:#ECEEF2; --ink:#1D2026; --muted:#5D6470; --line:#D8DCE3;
  --accent:#2C5BA9; --accent-ink:#FFFFFF; --accent-soft:#E3EBF7; --red:#D9402A; --ok:#2D7A4C; --ok-soft:#E1F1E7; --warn:#A8670F; --warn-soft:#FBF0DD;
  --hl:#FFF3A3;
  --f-display:"Archivo Narrow","Arial Narrow",Arial,sans-serif; --f-body:"IBM Plex Sans","Segoe UI",Arial,sans-serif; --f-mono:"IBM Plex Mono",Consolas,monospace;
  --r:6px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111317; --surface:#191C22; --sunk:#14171C; --ink:#E5E8ED; --muted:#99A1AD; --line:#2B3039;
  --accent:#7FA6E8; --accent-ink:#0F1A2E; --accent-soft:#1D2A40; --red:#F06A55; --ok:#6CC28D; --ok-soft:#18301F; --warn:#E3A84C; --warn-soft:#33270F; --hl:#5A5113; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111317; --surface:#191C22; --sunk:#14171C; --ink:#E5E8ED; --muted:#99A1AD; --line:#2B3039;
  --accent:#7FA6E8; --accent-ink:#0F1A2E; --accent-soft:#1D2A40; --red:#F06A55; --ok:#6CC28D; --ok-soft:#18301F; --warn:#E3A84C; --warn-soft:#33270F; --hl:#5A5113; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:14px/1.5 var(--f-body);margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{display:grid;grid-template-columns:300px minmax(0,1fr);min-height:100%}
/* sidebar */
.side{background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;gap:12px;padding-block:18px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:16px;position:sticky;top:0;height:100vh;overflow:auto}
.brand{display:flex;align-items:center;gap:10px}
.mark{width:24px;height:28px;flex:none;border:2px solid var(--accent);border-radius:3px;position:relative;background:var(--surface)}
.mark::before,.mark::after{content:"";position:absolute;left:4px;right:4px;height:2px;background:var(--accent);top:8px;box-shadow:0 5px 0 var(--accent)}
.mark::after{top:18px;right:9px;box-shadow:none}
#setBtn{margin-top:auto}
.brand b{font:700 19px/1 var(--f-display);letter-spacing:.02em}
.brand span{display:block;font-size:12px;color:var(--muted)}
.side input[type=search]{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:var(--r);background:var(--sunk)}
#projList{display:flex;flex-direction:column;gap:6px}
.proj{display:flex;flex-direction:column;gap:3px;text-align:left;padding:10px;border:1px solid transparent;border-radius:var(--r);background:none;cursor:pointer;width:100%}
.proj:hover{background:var(--sunk)}
.proj.on{background:var(--accent-soft);border-color:var(--accent)}
.proj-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.proj-name{font-size:13px;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.proj-fn{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--line);display:inline-block}
.dot.ok{background:var(--ok)} .dot.prop{background:var(--warn)}
.empty-side{color:var(--muted);font-size:13px}
.code{font:500 12px/1 var(--f-mono);letter-spacing:.02em}
.code.big{font-size:14px}
.chip{display:inline-flex;align-items:center;font:600 11px/1 var(--f-display);letter-spacing:.06em;text-transform:uppercase;padding:4px 7px;border-radius:4px;background:var(--sunk);color:var(--muted);border:1px solid var(--line)}
.chip.fn{text-transform:none;letter-spacing:0;font:500 12px/1.2 var(--f-body)}
.chip.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.chip.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
/* main */
main{min-width:0;padding-block:20px 60px;padding-left:28px;padding-right:max(16px,env(safe-area-inset-right,0px))}
.phead{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap}
.ph-l{min-width:0;flex:1 1 420px}
.ph-code{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.phead h1{font:600 21px/1.2 var(--f-display);margin:8px 0 0;text-wrap:balance;max-width:80ch;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.save{font-size:12px;color:var(--muted)} .save.ok::before{content:"● ";color:var(--ok)} .save.pending::before{content:"● ";color:var(--warn)} .save.err{color:var(--red)}
.tabs{display:flex;gap:2px;margin-top:18px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:thin}
.tab{border:0;background:none;padding:10px 12px;cursor:pointer;color:var(--muted);font:600 14px/1 var(--f-display);letter-spacing:.02em;border-bottom:2px solid transparent;white-space:nowrap;display:flex;gap:6px;align-items:center}
.tab:hover{color:var(--ink)}
.tab.on{color:var(--ink);border-bottom-color:var(--red)}
.pct{font:500 10px/1 var(--f-mono);color:var(--muted);background:var(--sunk);padding:3px 4px;border-radius:3px}
.pct.full{color:var(--ok);background:var(--ok-soft)}
.tabbody{display:flex;flex-direction:column;gap:18px;padding-top:18px}
.grp{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);padding:14px 16px 16px;margin:0;min-width:0}
.grp legend{font:700 13px/1 var(--f-display);letter-spacing:.08em;text-transform:uppercase;padding:0 6px;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px 14px}
.fld{display:flex;flex-direction:column;gap:4px;min-width:0}
.fld.wide{grid-column:1/-1}
.fld label{font-size:12px;color:var(--muted)}
.fld input,.fld select,.fld textarea,.tabbody textarea{width:100%;padding:7px 9px;border:1px solid var(--line);border-left:3px solid var(--line);border-radius:var(--r);background:var(--sunk);resize:vertical;min-width:0}
.fld.filled input,.fld.filled select,.fld.filled textarea{border-left-color:var(--accent);background:var(--surface)}
.fld textarea{line-height:1.45}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:8px 14px;cursor:pointer;font-weight:500}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.ghost{background:none}
.btn.sm{padding:4px 10px;font-size:13px;margin-top:8px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:10px}
.muted{color:var(--muted)}
.welcome{max-width:640px;padding-top:40px}
.welcome h2{font:600 30px/1.15 var(--f-display);margin:0 0 10px;text-wrap:balance}
.welcome ol{padding-left:20px;display:flex;flex-direction:column;gap:6px;margin:16px 0 22px}
.dest-row{display:flex;gap:16px;flex-wrap:wrap;align-items:flex-end}
.dest-row .fld{flex:1 1 320px}
.dest-state{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.motiv{margin:10px 0 0;font-size:13px}
.fncard{display:grid;grid-template-columns:minmax(120px,190px) minmax(0,1fr);gap:6px 14px;margin:14px 0 0;padding:12px 14px;background:var(--sunk);border-radius:var(--r);font-size:13px}
.fncard dt{color:var(--muted)} .fncard dd{margin:0}
.calc{margin:10px 0 0}
.central{display:flex;flex-direction:column;gap:14px}
.sech{font:600 22px/1.2 var(--f-display);margin:6px 0 0}
.sheet{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 16px 14px;min-width:0}
.sheet h3{font:700 13px/1.2 var(--f-display);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:0 0 8px;display:flex;justify-content:space-between;gap:10px}
.sheet .cnt{font:500 11px/1 var(--f-mono);letter-spacing:0;color:var(--muted)}
.rows{display:flex;flex-direction:column}
.r{display:grid;grid-template-columns:minmax(150px,260px) minmax(0,1fr);gap:4px 16px;padding:5px 0;border-top:1px solid var(--line);align-items:start}
.rows .r:first-child{border-top:0}
.k{font-size:13px;color:var(--muted);padding-top:5px}
.needs{display:block;font-size:11px;color:var(--warn);margin-top:2px}
.cellin{width:100%;border:1px solid transparent;background:none;border-radius:4px;padding:4px 6px;resize:none;line-height:1.45;min-width:0;overflow:hidden}
.cellin:hover{border-color:var(--line)}
.cellin:focus{border-color:var(--accent);background:var(--surface)}
.cellin::placeholder{color:var(--muted);opacity:.7}
.cellw{display:flex;align-items:flex-start;gap:4px}
table.bilant{border-collapse:collapse;width:100%;font-size:13px}
table.bilant th,table.bilant td{border-bottom:1px solid var(--line);padding:3px 6px;text-align:left;vertical-align:top}
table.bilant thead th{font:600 12px/1.2 var(--f-display);color:var(--muted);letter-spacing:.04em}
table.bilant tbody th{font-weight:500;color:var(--muted);white-space:nowrap}
.emptyrows summary{cursor:pointer;font-size:12px;color:var(--muted);padding:6px 0}
details.sheet>summary{cursor:pointer}
.docchips{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.dchip{display:inline-flex;gap:6px;align-items:center;border:1px solid var(--line);border-radius:999px;padding:4px 10px;font-size:12px;cursor:pointer;background:var(--surface)}
.dchip.on{border-color:var(--accent);background:var(--accent-soft)}
.dchip input{margin:0}
.pct.warnb{color:var(--warn);background:var(--warn-soft)}
.extr{white-space:pre-wrap;font:12px/1.45 var(--f-mono);background:var(--sunk);padding:8px;border-radius:4px;max-height:260px;overflow:auto;margin:6px 0 0}
.pend td{vertical-align:top}
.pend td:nth-child(2){width:32%}
.pend small{display:block;color:var(--muted);font-size:11px;margin-top:2px}
.pend .propin{border-color:var(--line);background:var(--surface)}
.pend tr.contra td:nth-child(2) b{color:var(--warn)}
.tag{display:inline-block;margin-left:6px;font:600 10px/1 var(--f-display);text-transform:uppercase;letter-spacing:.06em;background:var(--warn-soft);color:var(--warn);padding:3px 5px;border-radius:3px}
.was summary{font-size:11px;color:var(--muted);cursor:pointer;margin-top:4px}
.was p{margin:4px 0 0;font-size:12px}
.okmsg{padding:12px 14px;background:var(--ok-soft);color:var(--ok);border-radius:var(--r)}
@media (max-width:820px){.r{grid-template-columns:1fr}}
.auto{display:inline-flex;align-items:center;justify-content:center;margin-left:6px;width:15px;height:15px;border-radius:3px;background:var(--accent-soft);color:var(--accent);font:700 10px/1 var(--f-display);vertical-align:1px;cursor:help}
.fillbar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:10px 14px;background:var(--accent-soft);border-radius:var(--r)}
.subh{font:700 13px/1 var(--f-display);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:16px 0 8px}
.tblwrap{overflow-x:auto;max-width:100%}
table.edit,table.prop{border-collapse:collapse;width:100%;font-size:13px}
table.edit th,table.prop th{text-align:left;font:600 12px/1.2 var(--f-display);letter-spacing:.04em;color:var(--muted);padding:6px;border-bottom:1px solid var(--line);white-space:nowrap}
table.edit td{padding:2px;border-bottom:1px solid var(--line)}
table.edit input{width:100%;min-width:70px;border:1px solid transparent;background:none;padding:5px 6px;border-radius:4px}
table.edit input:focus{border-color:var(--accent);background:var(--surface)}
table.prop td{padding:7px 6px;border-bottom:1px solid var(--line);vertical-align:top}
table.prop td small{display:block;color:var(--muted);font-size:11px}
table.prop tr.diff td:nth-child(4){color:var(--warn)}
.x{border:0;background:none;color:var(--muted);font-size:18px;line-height:1;cursor:pointer;padding:2px 8px;border-radius:4px}
.x:hover{color:var(--red);background:var(--sunk)}
.banner{padding:10px 14px;border-radius:var(--r);background:var(--accent-soft);font-size:13px}
.banner.warn{background:var(--warn-soft);color:var(--ink);border-left:3px solid var(--warn)}
.docgrp h3{font:700 13px/1 var(--f-display);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:6px 0 10px}
.docs{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.doc{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px}
.doc.cur{border-top:3px solid var(--red)}
.doc h4{margin:0;font:600 16px/1.25 var(--f-display);text-wrap:balance;flex:1}
.doc-top{display:flex;justify-content:space-between;align-items:center}
.miss{font-size:12px} .miss.ok{color:var(--ok)} .miss.warn{color:var(--warn)}
.doc details summary{cursor:pointer;font-size:12px;color:var(--muted)}
.misslist{font-size:12px;margin:6px 0 0;background:var(--hl);color:var(--ink);padding:6px 8px;border-radius:4px}
.doc .btn{align-self:flex-start}
.legi{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px;font-size:13px}
.legi li.spec{color:var(--accent);font-weight:500}
#artSearch{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:var(--r);background:var(--sunk);margin-bottom:12px}
.arts{display:flex;flex-direction:column;gap:10px;max-height:640px;overflow:auto}
.art{display:grid;grid-template-columns:110px minmax(0,1fr);gap:12px;padding-bottom:10px;border-bottom:1px solid var(--line)}
.art p{margin:0;font-size:13px}
.artn{font:500 12px/1.4 var(--f-mono);color:var(--accent)}
.drop{display:block;border:1.5px dashed var(--line);border-radius:var(--r);padding:22px;text-align:center;cursor:pointer;background:var(--sunk);margin-bottom:10px}
.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.drop input{display:none}
.files{list-style:none;padding:0;margin:0 0 10px;display:flex;flex-direction:column;gap:4px}
.files li{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:6px 8px;background:var(--sunk);border-radius:4px;font-size:13px;flex-wrap:wrap}
.propdest{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap;padding:12px;background:var(--accent-soft);border-radius:var(--r);margin-bottom:12px}
.propdest strong{display:block;font:600 18px/1.2 var(--f-display)}
.propdest p{margin:4px 0 0;font-size:13px}
ul.dec{list-style:none;padding:0;margin:12px 0 0;display:flex;flex-direction:column;gap:6px}
ul.dec li{display:grid;grid-template-columns:90px minmax(0,1fr) auto;gap:10px;align-items:start;padding:8px 0;border-bottom:1px solid var(--line);font-size:13px}
ul.dec time{font:500 12px/1.6 var(--f-mono);color:var(--muted)}
#toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));right:max(20px,env(safe-area-inset-right,0px));background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:var(--r);font-size:13px;max-width:min(420px,calc(100vw - 40px));box-shadow:0 6px 24px rgba(0,0,0,.18)}
@media (max-width:820px){
  .app{grid-template-columns:1fr}
  .side{position:static;height:auto;border-right:0;border-bottom:1px solid var(--line);padding-right:max(16px,env(safe-area-inset-right,0px))}
  #projList{max-height:240px;overflow:auto}
  main{padding-left:max(16px,env(safe-area-inset-left,0px))}
  .fncard{grid-template-columns:1fr}
  .art{grid-template-columns:1fr;gap:2px}
  ul.dec li{grid-template-columns:1fr auto}
  ul.dec time{grid-column:1/-1}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
<div class="app">
  <aside class="side">
    <div class="brand"><span class="mark" aria-hidden="true"></span><div><b>MEMORII &amp; SSI</b><span>CATUC · P 118/1-2025</span></div></div>
    <button id="newBtn" class="btn primary">Proiect nou</button>
    <input type="search" id="projSearch" placeholder="Caută după cod, denumire, beneficiar" aria-label="Caută proiect">
    <div id="projList" aria-label="Proiecte"></div>
    <button id="setBtn" class="btn ghost" hidden onclick="window.MB_SETTINGS && window.MB_SETTINGS()">Setări</button>
  </aside>
  <main id="main"></main>
</div>
<div id="toast" role="status" hidden></div>
<script src="config.js" charset="utf-8"></script>
<script src="shim.js" charset="utf-8"></script>
<script>if (window.MB_STANDALONE) document.getElementById("setBtn").hidden = false;</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js" charset="utf-8"></script>
<script src="lib.js" charset="utf-8"></script>
<script src="docx.js" charset="utf-8"></script>
<script src="tpl.js" charset="utf-8"></script>
<script src="app.js" charset="utf-8"></script>
